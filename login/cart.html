<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/cartstyle.css">
</head>
<body>
  <header>
    <div class="container">
      <div class="top-bar">
        <a href="user.html" class="back-link">
          <i class="bi bi-arrow-left"></i> Continue Shopping
        </a>
        <button class="logout-btn" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i> Logout
        </button>
      </div>
      <h2 class="mb-0">Your Cart</h2>
    </div>
  </header>

  <main class="container">
    <div id="cartItems" class="mb-4"></div>
    
    <div class="summary" id="summarySection">
      <div class="summary-row">
        <span>Subtotal:</span>
        <span>₹<span id="subtotal">0</span></span>
      </div>
      <div class="summary-row">
        <span>Shipping:</span>
        <span id="shippingText">₹<span id="shipping">0</span></span>
      </div>
      <div class="summary-row summary-total">
        <span>Total:</span>
        <span>₹<span id="totalCost">0</span></span>
      </div>
      <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">
        Proceed to Checkout
      </button>
    </div>
  </main>

  <!-- Bootstrap JS Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your custom script -->
  <script src="js/script.js"></script>
 

</body>
</html>

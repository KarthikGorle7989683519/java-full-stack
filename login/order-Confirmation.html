<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/order-confirmation.css">
</head>
<body>
  <div class="container">
    <div class="confirmation-container">
      <div class="confirmation-header">
        <h1>Thank you for your order!</h1>
        <p>Order #<span id="orderId"></span></p>
      </div>
      
      <div class="confirmation-details">
        <h3>Order Details</h3>
        <div id="orderItems"></div>
        
        <div class="summary">
          <div class="summary-row">
            <span>Subtotal:</span>
            <span>₹<span id="orderSubtotal">0.00</span></span>
          </div>
          <div class="summary-row">
            <span>Shipping:</span>
            <span>₹<span id="orderShipping">0.00</span></span>
          </div>
          <div class="summary-row total">
            <span>Total:</span>
            <span>₹<span id="orderTotal">0.00</span></span>
          </div>
        </div>
      </div>
      
      <div class="shipping-info">
        <h3>Shipping Information</h3>
        <div id="shippingDetails"></div>
      </div>
      
      <a href="user.html" class="btn btn-primary">Continue Shopping</a>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>

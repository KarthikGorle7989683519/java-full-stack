<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/userstyle.css">
</head>
<body>
  <header class="bg-dark text-white shadow-sm">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center py-3">
        <!-- Search Bar -->
        <div class="d-flex flex-grow-1 me-3" style="max-width: 600px;">
          <input type="text" id="searchInput" class="form-control rounded-0 rounded-start" 
                 placeholder="Search products..." oninput="searchProducts()">
          <button class="btn btn-warning rounded-0 rounded-end">
            <i class="bi bi-search"></i>
          </button>
        </div>
        
        <!-- Cart and Logout -->
        <div class="d-flex align-items-center gap-3">
          <a href="cart.html" class="position-relative text-white text-decoration-none" id="cartLink">
            <i class="bi bi-cart3 fs-4"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                  id="cartCount">0</span>
          </a>
          <button class="btn btn-outline-light" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i> Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="py-4">
    <div class="container">
      <h2 class="mb-4">Welcome, <span id="username"></span>!</h2>
      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center">
          <h3>Our Products</h3>
          <small class="text-muted" id="productCount"></small>
        </div>
        <div id="productCards" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
          <!-- Products will be loaded here -->
        </div>
      </div>
    </div>
  </main>

  <script src="js/script.js"></script>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
